[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpg-day-ahead-bidding"
version = "1.0.0"
description = "DDPG bidding strategy for a single supplier in the Italian day-ahead electricity market"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Luca Di Persio" },
  { name = "Matteo Garbelli" },
  { name = "Luca Maria Giordano" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
  "matplotlib>=3.7",
]

[project.urls]
Paper = "https://doi.org/10.1016/j.eneco.2025.108673"
Repository = "https://github.com/matteogarbelli/ddpg-day-ahead-bidding"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# CPU-only torch wheels on Linux; macOS and Windows wheels on PyPI are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
